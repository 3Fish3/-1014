<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLB 装配修复工作台</title><link rel="stylesheet" href="./css/model-editor.css"><script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script></head>
<body>
<header><a href="./ui-v2.html">返回课程</a><h1>GLB 装配修复工作台</h1><span id="source-label">未加载模型</span><button id="load-course">加载课程整车</button><label class="file-button">打开 GLB<input id="file" type="file" accept=".glb" hidden></label><button id="save-patch" disabled>保存 JSON</button><button id="export-glb" disabled>导出草稿 GLB</button></header>
<main>
<aside class="left"><h2>节点层级</h2><input id="search" placeholder="节点名称或索引" aria-label="搜索节点"><div id="tree"></div><h2>异常候选（仅统计提示）</h2><p>距离异常不代表装配错误；不自动移动或删除。</p><div id="candidates"></div></aside>
<section class="workspace"><nav><button id="fit-all">整车镜头</button><button id="focus">聚焦选中 F</button><label><input type="checkbox" id="main-bounds">镜头暂排统计离群件</label></nav><div id="viewport"></div><div class="warning">原始坐标 · 无课堂归一化 · 人工调整，待机械核验</div><div id="message" role="status">加载模型后，通过左侧树或双击模型选择真实源节点。</div></section>
<aside class="right"><h2>选中节点</h2><pre id="node-info">未选择</pre><p id="group-warning"></p><div class="toolbar"><button id="translate">移动 W</button><button id="rotate">旋转 E</button><select id="space" aria-label="操作轴空间"><option value="local">局部轴</option><option value="world">世界轴</option></select></div><p>数值输入为节点局部变换；世界轴仅影响手柄。位置单位沿用源文件，角度为度。</p><fieldset id="numeric" disabled><legend>局部位置 XYZ</legend><div class="xyz"><input id="px" type="number" step="0.001" aria-label="位置X"><input id="py" type="number" step="0.001" aria-label="位置Y"><input id="pz" type="number" step="0.001" aria-label="位置Z"></div><legend>局部欧拉角 XYZ（度）</legend><div class="xyz"><input id="rx" type="number" step="1" aria-label="旋转X"><input id="ry" type="number" step="1" aria-label="旋转Y"><input id="rz" type="number" step="1" aria-label="旋转Z"></div><button id="apply">应用数值</button></fieldset><div class="toolbar"><button id="undo">撤销</button><button id="redo">重做</button><button id="reset-node">节点复位</button><button id="reset-all">恢复全部</button></div><div class="toolbar"><button id="isolate">隔离选中</button><button id="hide">隐藏选中</button><button id="show-all">恢复显示</button></div><p>隐藏与隔离仅影响观察，不会写入 GLB。</p><label for="note">变更说明</label><textarea id="note" rows="3">人工调整，待机械核验</textarea><p class="warning">首版导出均为未核实草稿，不会自动切换课堂资源。</p><label class="file-button">导入修复 JSON<input id="patch-file" type="file" accept=".json" hidden></label></aside>
</main><footer id="status">未加载 · 没有上传行为 · 完全离线</footer><script type="module" src="./js/model-editor/main.js"></script></body></html>
