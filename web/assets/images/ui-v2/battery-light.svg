<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260">
  <rect width="520" height="260" rx="16" fill="#f8fafc"/>
  <!-- 电池主体 -->
  <rect x="50" y="55" width="160" height="110" rx="12" fill="#2563eb" stroke="#1d4ed8" stroke-width="3"/>
  <text x="130" y="105" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="18" font-weight="bold" fill="#ffffff">动力锂电池</text>
  <text x="130" y="135" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" fill="#bfdbfe">高压大电流动力源</text>
  <!-- 动力供电路径 -->
  <path d="M 210 90 L 310 55 L 430 55" fill="none" stroke="#ea580c" stroke-width="4"/>
  <text x="440" y="60" font-family="-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#ea580c">➔ 直供驱动器 (电机高压)</text>
  <!-- 稳压分支路径 -->
  <path d="M 210 135 L 260 135" fill="none" stroke="#059669" stroke-width="4"/>
  <rect x="260" y="105" width="110" height="60" rx="8" fill="#10b981"/>
  <text x="315" y="132" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">DC-DC 稳压</text>
  <text x="315" y="152" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#d1fae5">降压至 5V / 3.3V</text>
  <path d="M 370 135 L 430 135" fill="none" stroke="#059669" stroke-width="4"/>
  <text x="440" y="140" font-family="-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#059669">➔ 供给单片机微控制器</text>
  <!-- 警示 -->
  <rect x="50" y="195" width="420" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="260" y="220" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="bold" fill="#b45309">⚠️ 严禁将未稳压的动力电池直接接入 STM32 引脚！</text>
</svg>