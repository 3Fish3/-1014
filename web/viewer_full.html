<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>机器人结构查看</title>
  <link rel="stylesheet" href="./css/robot-viewer.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
</head>
<body>
  <header>
    <a href="./ui-v2.html">返回课程</a>
    <h1>英雄机器人 · 结构查看</h1>
    <div class="view-actions">
      <button id="rotate" aria-pressed="false">自动旋转</button>
      <button id="wire" aria-pressed="false">线框</button>
      <button id="reset" disabled>适配可见结构</button>
    </div>
  </header>
  <main>
    <aside class="structure-panel" aria-label="CAD结构树与显隐工具">
      <h2>结构树</h2>
      <input id="search" type="search" placeholder="搜索名称或节点编号" aria-label="搜索结构">
      <div class="tree-legend">可见 · 自身隐藏 · 祖先隐藏</div>
      <div id="structure-tree" aria-label="模型结构树"></div>
      <section class="selection-tools">
        <h2>选中结构</h2>
        <div id="selection-name">未选择</div>
        <p id="selection-state">单击模型或左侧树选中；拖动旋转，滚轮缩放。</p>
        <div class="actions">
          <button id="hide-selected" disabled>隐藏选中</button>
          <button id="show-selected" disabled>显示选中</button>
          <button id="isolate-selected" disabled>隔离选中</button>
          <button id="focus-selected" disabled>聚焦选中</button>
          <button id="parent-selected" disabled>选择父组</button>
          <button id="exit-isolation" disabled>退出隔离</button>
        </div>
        <div class="actions global-actions">
          <button id="show-all" disabled>全部显示</button>
          <button id="restore-default" disabled>恢复默认</button>
        </div>
        <p>显示选中会打开必要祖先，但保留组内其他隐藏设置。隔离期间隐藏或显示会先退出隔离。</p>
      </section>
    </aside>
    <section class="scene-panel" aria-label="机器人三维观察区">
      <div class="notice">独立查看页默认隐藏 #549 偏置装配组；原文件未删除，可用“全部显示”恢复。不影响课堂默认模型。</div>
      <div id="canvas" aria-label="可点选旋转缩放的整车模型"></div>
      <div class="scene-help">单击选中 · 拖动旋转 · 滚轮缩放 · H 隐藏 · Shift+H 显示 · F 聚焦 · Esc 清除选择</div>
    </section>
  </main>
  <footer><span id="status" role="status">正在加载整车…</span><span>仅结构观察与显隐；不含动力学仿真，不保存到源模型。</span></footer>
  <script type="module" src="./js/robot-viewer.js"></script>
</body>
</html>
